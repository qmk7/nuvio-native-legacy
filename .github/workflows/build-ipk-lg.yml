# QR TIME for LG webOS: builds the .ipk with the account / metadata keys kept
# as repository secrets, so the Nuvio account login (QR + e-mail), TMDB and
# Trakt work in the package, and "Continue without an account" stays offered.
#
# Starts on a push whose commit message contains "[ipk]" (any branch), or from
# the Actions tab ("Build LG IPK" > Run workflow) once this file is on the
# default branch.
#
# Repository secrets (Settings > Secrets and variables > Actions), all optional;
# an empty one only switches its feature off:
#   NUVIO_BACKEND_URL, NUVIO_BACKEND_KEY (publishable key)               account login
#     (NUVIO_SUPABASE_URL / NUVIO_SUPABASE_ANON_KEY are read too, as before)
#   TV_LOGIN_WEB_BASE_URL   the QR sign-in page; default https://nuvio.tv/tv-login
#   TMDB_API_KEY                                                           metadata
#   TRAKT_CLIENT_ID                                                        Trakt (via the account)
#   TRAKT_CLIENT_SECRET   only for linking Trakt on the TV itself (device code)
#   SIMKL_CLIENT_ID, SIMKL_APP_NAME                                        Simkl
#   YOUTUBE_API_KEY, YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET   YouTube (search; your
#                      subscriptions and playlists), nothing typed on the TV
#   IPK_ZIP_PASSWORD   optional: when set, the artifact is an AES-256 7z with
#                      this password. This repository is public: without it the
#                      .ipk (which carries the keys above) can be downloaded by
#                      any signed-in GitHub user until it expires (1 day).
name: Build LG IPK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write   # publishes each build as a GitHub Release (in-app updates)

jobs:
  ipk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write local.properties from the secrets (never logged, never committed)
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_BACKEND_URL || secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_BACKEND_KEY || secrets.NUVIO_SUPABASE_ANON_KEY }}
          # Nuvio's public TV sign-in page (the QR opens <page>?code=<code>); a secret overrides it.
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL || 'https://nuvio.tv/tv-login' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          umask 077
          {
            for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TV_LOGIN_WEB_BASE_URL \
                     TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID SIMKL_APP_NAME \
                   YOUTUBE_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET; do
              printf '%s=%s\n' "$k" "${!k}"
            done
          } > local.properties
          # Which features are on (names only, never values).
          for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TV_LOGIN_WEB_BASE_URL \
                   TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID \
                   YOUTUBE_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET; do
            if [ -n "${!k}" ]; then echo "$k: set"; else echo "$k: empty (feature off)"; fi
          done

      - name: Version for this build (2.1.<run number>, always newer than the last)
        run: |
          set -e
          VER="2.1.${{ github.run_number }}"
          sed -i -E '0,/"version": *"[^"]*"/s//"version": "'"$VER"'"/' deploy/app/appinfo.json
          sed -i -E '0,/(<widget[^>]*|^[[:space:]]*)version="[0-9.]+"/s//\1version="'"$VER"'"/' tools/tizen-config.xml
          grep -n '"version"' deploy/app/appinfo.json
          grep -n ' version="' tools/tizen-config.xml | head -2
          echo "QRT_VER=$VER" >> "$GITHUB_ENV"

      - name: Build the .ipk (webOS SDK, pinned and checksummed by the script)
        run: bash tools/qrtime/build-ipk.sh

      - name: Package (encrypted only when IPK_ZIP_PASSWORD is set)
        env:
          IPK_ZIP_PASSWORD: ${{ secrets.IPK_ZIP_PASSWORD }}
        run: |
          set -e
          rm -f local.properties
          mkdir -p out
          cd build/ipk
          sha256sum *.ipk | tee ../../out/SHA256SUMS.txt
          if [ -n "$IPK_ZIP_PASSWORD" ]; then
            7z a -t7z -mhe=on -p"$IPK_ZIP_PASSWORD" ../../out/QR_TIME_LG_ipk.7z *.ipk >/dev/null
          else
            cp *.ipk ../../out/
          fi
          ls -la ../../out

      # IN-APP UPDATES: the app reads this repository's latest release, takes
      # the com.qrtime.tv_<version>_arm.ipk asset, checks its sha256 (the
      # asset's digest) and installs it through the Homebrew Channel. The
      # owner chose a public release (23/11/2026): the .ipk carries the build
      # keys and anyone can download it.
      - name: Publish the release (in-app update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPK=$(ls build/ipk/com.qrtime.tv_*_arm.ipk | head -1)
          test -f "$IPK"
          git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed 's/ *\[ipk\]//' > notes.txt
          printf '\n\n## Notes\nInstall: Settings > About and help > Update now (or the .ipk with webOS Dev Manager).\n' >> notes.txt
          gh release create "v$QRT_VER" "$IPK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "QR TIME $QRT_VER" --notes-file notes.txt --latest

      - uses: actions/upload-artifact@v4
        with:
          name: QR_TIME_LG_ipk
          path: out/
          retention-days: 1
