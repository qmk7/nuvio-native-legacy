# QR TIME for LG webOS: builds the .ipk with the account / metadata keys kept
# as repository secrets, so the Nuvio account login (QR + e-mail), TMDB and
# Trakt work in the package, and "Continue without an account" stays offered.
#
# Starts on a push whose commit message contains "[ipk]" (any branch), or from
# the Actions tab ("Build LG IPK" > Run workflow) once this file is on the
# default branch.
#
# Repository secrets (Settings > Secrets and variables > Actions), all optional;
# an empty one only switches its feature off:
#   NUVIO_SUPABASE_URL, NUVIO_SUPABASE_ANON_KEY, TV_LOGIN_WEB_BASE_URL   account login
#   TMDB_API_KEY                                                           metadata
#   TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET                                   Trakt
#   SIMKL_CLIENT_ID, SIMKL_APP_NAME                                        Simkl
#   IPK_ZIP_PASSWORD   optional: when set, the artifact is an AES-256 7z with
#                      this password. This repository is public: without it the
#                      .ipk (which carries the keys above) can be downloaded by
#                      any signed-in GitHub user until it expires (1 day).
name: Build LG IPK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  ipk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write local.properties from the secrets (never logged, never committed)
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
        run: |
          umask 077
          {
            for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TV_LOGIN_WEB_BASE_URL \
                     TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID SIMKL_APP_NAME; do
              printf '%s=%s\n' "$k" "${!k}"
            done
          } > local.properties
          # Which features are on (names only, never values).
          for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TV_LOGIN_WEB_BASE_URL \
                   TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID; do
            if [ -n "${!k}" ]; then echo "$k: set"; else echo "$k: empty (feature off)"; fi
          done

      - name: Build the .ipk (webOS SDK, pinned and checksummed by the script)
        run: bash tools/qrtime/build-ipk.sh

      - name: Package (encrypted only when IPK_ZIP_PASSWORD is set)
        env:
          IPK_ZIP_PASSWORD: ${{ secrets.IPK_ZIP_PASSWORD }}
        run: |
          set -e
          rm -f local.properties
          mkdir -p out
          cd build/ipk
          sha256sum *.ipk | tee ../../out/SHA256SUMS.txt
          if [ -n "$IPK_ZIP_PASSWORD" ]; then
            7z a -t7z -mhe=on -p"$IPK_ZIP_PASSWORD" ../../out/QR_TIME_LG_ipk.7z *.ipk >/dev/null
          else
            cp *.ipk ../../out/
          fi
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: QR_TIME_LG_ipk
          path: out/
          retention-days: 1
